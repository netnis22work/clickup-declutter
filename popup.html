<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Tokens mirror ClickUp's own design system. popup.js overwrites them with the
       live values (light/dark + workspace theme color) captured from app.clickup.com.
       These defaults are ClickUp's dark theme, used until ClickUp has been opened once. */
    :root {
      --bg: #111111;
      --hover: rgba(255, 255, 255, 0.07);
      --surface: #191919;
      --surface-hover: #2a2a2a;
      --line: #2a2a2a;
      --line-soft: #222222;
      --track: #484848;
      --fg: #eeeeee;
      --muted: #b4b4b4;
      --faint: #7b7b7b;
      --placeholder: #6e6e6e;
      --accent: #6347ea;
      --accent-hover: #5c47cd;
      --accent-fg: #a89fff;
      --danger: #e5484d;
      --warn: #ffb224;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-cu]) {
        --bg: #ffffff;
        --hover: rgba(0, 0, 0, 0.04);
        --surface: #f9f9f9;
        --surface-hover: #f0f0f0;
        --line: #e8e8e8;
        --line-soft: #f0f0f0;
        --track: #d1d1d1;
        --fg: #202020;
        --muted: #646464;
        --faint: #8f8f8f;
        --placeholder: #a0a0a0;
        --accent-fg: #6347ea;
        color-scheme: light;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; width: 320px; max-height: 590px;
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--fg);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    svg { flex: none; }

    /* header */
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
    header img { width: 24px; height: 24px; border-radius: 6px; }
    .title { flex: 1; min-width: 0; line-height: 1.25; }
    .title b { display: block; font-size: 13px; font-weight: 600; }
    .title span { display: block; font-size: 11px; color: var(--faint); }

    /* switches: ClickUp-sized, accent when on */
    .switch {
      appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
      width: 26px; height: 16px; border-radius: 999px; background: var(--track);
      position: relative; transition: background .12s ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
      border-radius: 50%; background: #fff; transition: transform .12s ease;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(10px); }
    /* some items in the group on */
    .switch:indeterminate { background: color-mix(in srgb, var(--accent) 45%, var(--track)); }
    .switch:indeterminate::after { transform: translateX(10px); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* search */
    .search { position: relative; padding: 10px 14px 8px; }
    .search svg { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); margin-top: 1px; color: var(--placeholder); }
    .search input {
      width: 100%; height: 28px; padding: 0 8px 0 28px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; outline: none;
    }
    .search input:hover { border-color: var(--track); }
    .search input:focus { border-color: var(--accent); }
    .search input::placeholder { color: var(--placeholder); }

    /* list */
    main { flex: 1; overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    body.off main { opacity: .4; }

    .group { border-radius: 8px; margin-bottom: 2px; }
    .group:not(.collapsed) { background: var(--surface); margin: 4px 0 6px; }
    .group-head { display: flex; align-items: center; gap: 8px; padding: 2px 8px 2px 2px; border-radius: 8px; }
    .group.collapsed .group-head:hover { background: var(--hover); }
    .group-toggle {
      flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px;
      background: none; border: 0; padding: 0 4px; cursor: pointer; text-align: left; border-radius: 6px;
    }
    .group-icon { width: 20px; height: 20px; display: grid; place-items: center; color: var(--muted); }
    .group-name { font-weight: 500; }
    .count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .group:not(.collapsed) .count { color: var(--accent-fg); }
    .chev { display: grid; color: var(--faint); transition: transform .12s ease; }
    .group.collapsed .chev { transform: rotate(-90deg); }
    .group.collapsed .items { display: none; }

    .items { padding: 0 4px 4px; }
    .item {
      display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 6px 0 32px;
      border-radius: 6px; cursor: pointer; user-select: none; color: var(--muted);
    }
    .item:hover { background: var(--hover); color: var(--fg); }
    .item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* picked */
    .chip { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 2px 4px 2px 32px; border-radius: 6px; }
    .chip:hover { background: var(--hover); }
    .chip code { display: block; font: 10.5px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--faint); overflow-wrap: anywhere; }
    .icon-btn {
      width: 22px; height: 22px; display: grid; place-items: center; flex: none;
      border: 0; border-radius: 5px; background: none; color: var(--faint); cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--fg); }
    .empty { padding: 4px 8px 8px 32px; color: var(--faint); font-size: 12px; }
    .no-match { padding: 24px 0; text-align: center; color: var(--faint); }

    /* footer */
    footer { display: flex; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--line-soft); }
    .btn {
      height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--line); background: none; font-size: 12px; font-weight: 500;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn:hover { background: var(--hover); }
    .btn.primary { flex: 1; border-color: transparent; background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.confirm { border-color: var(--danger); color: var(--danger); }

    /* header icon button (gear / back) */
    .head-btn {
      position: relative; width: 26px; height: 26px; display: grid; place-items: center; flex: none;
      border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer;
    }
    .head-btn:hover { background: var(--hover); color: var(--fg); }
    .dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--bg); }
    .dot[hidden] { display: none; }
    .item .warn { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }

    /* views */
    [hidden] { display: none !important; }
    #view-settings { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .settings { flex: 1; overflow-y: auto; padding: 4px 14px 14px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .settings h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
    .settings h3:first-child { margin-top: 8px; }
    .hint { margin: 0 0 8px; font-size: 12px; color: var(--faint); }
    .card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 10px; }
    .row + .row { border-top: 1px solid var(--line-soft); }
    .row .grow { flex: 1; min-width: 0; }
    .row .sub { display: block; font-size: 11px; color: var(--faint); }
    button.row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
    button.row:hover { background: var(--hover); }
    .check { color: var(--accent); visibility: hidden; }
    .row.current .check { visibility: visible; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn-row .btn { flex: 1; }
    .link { border: 0; background: none; padding: 0; color: var(--accent-fg); cursor: pointer; font-size: 12px; }
    .link:hover { text-decoration: underline; }
    textarea {
      width: 100%; height: 90px; margin-top: 8px; padding: 8px; resize: vertical; border-radius: 6px;
      border: 1px solid var(--line); background: var(--bg); color: var(--fg);
      font: 11px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    kbd { padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; font: 11px ui-monospace, Consolas, monospace; color: var(--fg); background: var(--surface); }
    .ok { color: var(--muted); font-size: 12px; }
    .note { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .note.error { color: var(--danger); }
    .chip-name { flex: 1; min-width: 0; }
    .chip-name b { display: block; font-weight: 400; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
    .chip-name input { width: 100%; height: 22px; padding: 0 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; outline: none; }

    #msg { margin: 0 14px 10px; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
    #msg:empty { display: none; }
  </style>
</head>
<body>
  <div id="view-main" style="display:contents">
    <header>
      <img src="icons/48.png" alt="">
      <div class="title">
        <b>Declutter for ClickUp</b>
        <span id="summary">&nbsp;</span>
      </div>
      <button id="open-settings" class="head-btn" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="dot" id="health-dot" hidden></span>
      </button>
      <input type="checkbox" class="switch" id="master" title="Turn everything on or off (Alt+Shift+D)" aria-label="Enabled">
    </header>

    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filter" type="search" placeholder="Search items" autocomplete="off">
    </div>

    <main id="list"></main>
    <div id="msg"></div>

    <footer>
      <button id="pick" class="btn primary">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        Pick element
      </button>
    </footer>
  </div>

  <div id="view-settings" hidden>
    <header>
      <button id="close-settings" class="head-btn" title="Back" aria-label="Back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="title"><b>Settings</b></div>
    </header>
    <div class="settings">
      <h3>Presets</h3>
      <div class="card" id="presets"></div>

      <h3>Rule health</h3>
      <div id="health"></div>

      <h3>Share settings</h3>
      <p class="hint">Copy your setup and paste it on a teammate's browser. Nothing is uploaded.</p>
      <div class="btn-row">
        <button class="btn" id="copy">Copy</button>
        <button class="btn" id="save-file">Save file</button>
        <button class="btn" id="show-import">Import</button>
      </div>
      <div id="import-box" hidden>
        <textarea id="import-text" placeholder="Paste settings here" spellcheck="false"></textarea>
        <div class="btn-row" style="margin-top:6px">
          <button class="btn primary" id="apply-import">Apply</button>
          <button class="btn" id="load-file">Load file</button>
        </div>
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </div>
      <div class="note" id="share-note"></div>

      <h3>Keyboard shortcut</h3>
      <div class="card"><div class="row">
        <span class="grow">Turn on or off</span>
        <span id="shortcut"></span>
        <button class="link" id="change-shortcut">Change</button>
      </div></div>

      <h3>Reset</h3>
      <div class="card"><div class="row">
        <span class="grow">Restore defaults<span class="sub">Turns every rule back to default and removes picked elements.</span></span>
        <button id="reset" class="btn">Reset</button>
      </div></div>

      <h3>About</h3>
      <p class="hint" id="about"></p>
    </div>
  </div>

  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
