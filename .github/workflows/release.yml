name: Release

# Push a tag like v1.0.1 (matching manifest.json "version") to build the
# store zip and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          manifest=$(jq -r .version manifest.json)
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $manifest" >&2
            exit 1
          fi

      - name: Validate JSON and JS syntax
        run: |
          jq empty manifest.json
          for f in rules.js content.js popup.js; do node --check "$f"; done

      - name: Build zip
        run: bash scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Upload the attached zip to the Chrome Web Store, or unzip it and use Load unpacked."
